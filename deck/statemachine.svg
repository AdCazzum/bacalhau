<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b90a3"/>
    </marker>
    <style>
      .box { fill: #15161d; stroke: #292c3b; stroke-width: 1.5; rx: 12; }
      .t  { fill: #e0e0e4; font-size: 18px; font-weight: 600; }
      .s  { fill: #8b90a3; font-size: 13px; }
      .m  { fill: #e0e0e4; font-size: 15px; font-family: ui-monospace, Menlo, monospace; }
      .e  { stroke: #8b90a3; stroke-width: 1.5; fill: none; marker-end: url(#b); }
      .lbl{ font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect class="box" x="330" y="20" width="340" height="86" stroke="#ff027f"/>
  <text class="m" x="356" y="52">0x23  jumpIfInventoryAbove 70%</text>
  <text class="s" x="356" y="80">our opcode — branches on state, not on the trade</text>

  <path class="e" d="M420,106 L250,168"/>
  <path class="e" d="M580,106 L750,168"/>
  <text class="lbl" x="250" y="140" fill="#00ebfc">below 70%</text>
  <text class="lbl" x="700" y="140" fill="#ff027f">above 70%</text>

  <rect class="box" x="60" y="172" width="380" height="96" stroke="#00ebfc"/>
  <text class="t" x="86" y="204">Accumulate</text>
  <text class="s" x="86" y="228">quote 5 bps — cheap to sell me ETH</text>
  <text class="m" x="86" y="254">0x22 inventorySkew → target 70/30</text>

  <rect class="box" x="560" y="172" width="380" height="96" stroke="#ff027f"/>
  <text class="t" x="586" y="204">Distribute</text>
  <text class="s" x="586" y="228">quote 50 bps — expensive to buy ETH</text>
  <text class="m" x="586" y="254">0x22 inventorySkew → target 70/30</text>

  <text class="s" x="60" y="308">Same wallet. Same funds. The VM picks the branch at swap time, on-chain.</text>
</svg>
