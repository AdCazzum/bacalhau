specVersion: v0.1.0
package:
  name: bacalhau_aqua
  version: v0.1.0
  url: https://github.com/AdCazzum/bacalhau
  description: |
    Decodes 1inch Aqua shared-liquidity events (Shipped, Docked, Pulled,
    Pushed) into a typed stream. Powers the Bacalhau strategy studio's
    subgraph: the first indexer for Aqua/SwapVM strategies.

protobuf:
  files:
    - bacalhau/v1/aqua.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/bacalhau_substreams.wasm

network: base-sepolia

# The Aqua contract address on Base Sepolia is injected via the map_events
# param (set once the SepoliaEnv deploy runs). The module filters logs to it.
params:
  map_events: "aqua=0xE5Cf2ec690BeE8b59cB8340f469ecfB2f0De98bD"

modules:
  - name: map_events
    kind: map
    initialBlock: 44584712
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:bacalhau.v1.Events
